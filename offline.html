<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06151f">
  <link rel="icon" href="/uploads/sbtc-lo.png" type="image/png">
  <title>Be The Change · Offline</title>
  <style>
    :root{color-scheme:dark;background:#041019;color:#ecf7f7;font:16px/1.5 system-ui,sans-serif}
    body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 25%,#143c4a 0,#06151f 45%,#041019 100%)}
    main{width:min(520px,100%);padding:32px;border:1px solid #2b5663;border-radius:24px;background:rgba(7,27,37,.88);box-shadow:0 20px 70px #0008}
    .mark{width:58px;height:58px;border:2px solid #78eee5;border-radius:50%;display:grid;place-items:center;color:#eacb83;font-size:30px;margin-bottom:25px}
    h1{margin:0 0 12px;font-size:clamp(28px,8vw,44px);line-height:1;letter-spacing:-.05em}p{color:#adc2c7;margin:0 0 24px}
    a,button{min-height:44px;box-sizing:border-box;border:1px solid #78eee5;border-radius:10px;padding:11px 14px;color:#06151f;background:#78eee5;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;margin:4px 5px 0 0;cursor:pointer}
    a.secondary,button.secondary{color:#e6f4f4;background:transparent;border-color:#456d77}
  </style>
</head>
<body><main><div class="mark" aria-hidden="true">◎</div><h1>You are temporarily offline.</h1><p>Your saved learning, drafts, and downloaded mission information are still available. Uncached content needs a connection.</p><a href="/education">View Downloaded Courses</a><a class="secondary" href="/#missions">Open Saved Missions</a><a class="secondary" href="/#join">Continue a Draft</a><button class="secondary" onclick="location.reload()">Retry Connection</button><a class="secondary" href="/">Return Home</a></main></body>
</html>
