<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#06151f" />
    <title>Page Not Found</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="empty-state page-error">
        <div class="eyebrow">404 · public index</div>
        <h1>That page moved.</h1>
        <p>The destination is not in the public index. The network is still here when you are ready to find another path.</p>
        <div class="page-error-actions">
          <a class="btn primary" href="/">Return home</a>
          <a class="btn" href="/missions">Browse missions</a>
          <a class="btn" href="/map/">Open the map</a>
        </div>
      </section>
    </main>
  </body>
</html>
